name: CI

# 纯 Python 项目，没有 Go 后端也没有前端，因此接不了 Felix2yu/.github 的
# reusable-test.yml（它的契约是「go-dir 留空则只跑 web-dir」，而本仓两者都没有）。
# 这份工作流按同样的原则手写：只跑真正需要的东西，不为统一而硬套。
on:
  push:
    branches: [main]
    paths:
      - "rssrob/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - "requirements-web.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "rssrob/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - "requirements-web.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt pytest

      - name: Run tests
        run: python -m pytest -q
