services:
  rssrob:
    build: .
    container_name: rssrob
    ports:
      - "5000:5000"
    environment:
      # 全局无头浏览器服务（可选的 browserless 部署）；也可在 sites.yaml 按站点配 browserless:
      RSSROB_BROWSERLESS: ${RSSROB_BROWSERLESS:-}
      # 全局代理（可选）
      RSSROB_PROXY: ${RSSROB_PROXY:-}
    volumes:
      - ./configs:/app/configs
      - ./var:/app/var
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
